name: ARKAB Maps Setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install maps and GPS
        run: |
          npx --yes @expo/agent-cli@latest install expo-location @maplibre/maplibre-react-native@11.5.1

      - name: Configure Expo
        run: |
          node <<'JS'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const e = config.expo;
          e.version = '0.4.0';
          e.android = e.android || {};
          e.android.versionCode = 4;
          e.android.permissions = [...new Set([
            ...(e.android.permissions || []),
            'ACCESS_FINE_LOCATION',
            'ACCESS_COARSE_LOCATION'
          ])];
          e.plugins = e.plugins || [];
          for (const p of ['expo-location', '@maplibre/maplibre-react-native']) {
            if (!e.plugins.includes(p)) e.plugins.push(p);
          }
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          JS

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app.json
          git diff --cached --quiet || git commit -m "ARKAB v0.4 Maps and GPS setup"
          git push
